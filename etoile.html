```html
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vérité Étoile 🍐</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .container {
            text-align: center;
        }

        /* Titre */
        h1 {
            color: white;
            font-size: 38px;
            margin-bottom: 35px;
        }

        /* Bouton étoile violet */
        .bouton {
            width: 190px;
            height: 190px;
            border: none;
            background: linear-gradient(145deg, #c05cff, #6a0dad);
            cursor: pointer;

            /* Forme étoile */
            clip-path: polygon(
                50% 0%,
                61% 35%,
                98% 35%,
                68% 57%,
                79% 94%,
                50% 72%,
                21% 94%,
                32% 57%,
                2% 35%,
                39% 35%
            );

            filter:
                drop-shadow(0 12px 0 #42006b)
                drop-shadow(0 20px 25px rgba(150, 0, 255, 0.45));

            transition: 0.1s;
        }

        .bouton:hover {
            transform: scale(1.04);

            filter:
                drop-shadow(0 14px 0 #42006b)
                drop-shadow(0 25px 35px rgba(180, 0, 255, 0.55));
        }

        .bouton:active {
            transform: translateY(8px) scale(0.98);

            filter:
                drop-shadow(0 4px 0 #42006b)
                drop-shadow(0 10px 15px rgba(150, 0, 255, 0.35));
        }

        /* Fond sombre */
        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            justify-content: center;
            align-items: center;
        }

        /* Fenêtre de confirmation */
        .fenetre {
            background: #181818;
            color: white;
            width: 400px;
            padding: 35px;
            border-radius: 18px;
            text-align: center;

            box-shadow:
                0 0 40px rgba(150, 0, 255, 0.35),
                0 15px 40px rgba(0,0,0,0.8);
        }

        .fenetre h2 {
            margin-top: 0;
            font-size: 24px;
        }

        .fenetre p {
            font-size: 18px;
            margin-bottom: 30px;
        }

        /* Boutons */
        .oui, .non {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
        }

        .oui {
            background: #7b1fd1;
            color: white;
        }

        .oui:hover {
            background: #9b3ff0;
        }

        .non {
            background: #444;
            color: white;
        }

        .non:hover {
            background: #555;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Vérité Étoile 🍐</h1>

        <button class="bouton" onclick="ouvrirConfirmation()"></button>

    </div>


    <!-- Fenêtre de confirmation -->
    <div class="overlay" id="confirmation">

        <div class="fenetre">

            <h2>⚠️ Confirmation</h2>

            <p>Es-tu sûre de vouloir faire cela, Sabah ?</p>

            <button class="oui" onclick="confirmer()">Oui</button>
            <button class="non" onclick="fermerConfirmation()">Non</button>

        </div>

    </div>


    <script>

        function ouvrirConfirmation() {
            document.getElementById("confirmation").style.display = "flex";
        }

        function fermerConfirmation() {
            document.getElementById("confirmation").style.display = "none";
        }

        function confirmer() {
            alert("Sabah, tu n'es pas encore prête à savoir la vérité.");
            fermerConfirmation();
        }

    </script>

</body>
</html>
